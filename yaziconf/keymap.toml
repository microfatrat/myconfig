# ============================================================
# keymap.toml — Yazi 快捷键配置文件
# 使用 prepend_keymap 在默认键位之前插入 (优先级更高)
# 使用 append_keymap 在默认键位之后追加 (优先级更低)
# 使用 keymap 完全覆盖默认键位
# 默认配置: https://github.com/sxyazi/yazi/tree/shipped/yazi-config/preset
# ============================================================

# =========================================
# [mgr] — 文件管理器层
# =========================================
[mgr]

keymap = [
	# --- 基础操作 ---
	{ on = "<Esc>", run = "escape",             desc = "退出可视模式、清除选择或取消搜索" },
	{ on = "<C-[>", run = "escape",             desc = "退出可视模式、清除选择或取消搜索" },
	{ on = "q",     run = "quit",               desc = "退出 Yazi" },
	{ on = "Q",     run = "quit --no-cwd-file", desc = "退出但不输出 cwd-file (配合 shell wrapper)" },
	{ on = "<C-c>", run = "close",              desc = "关闭当前标签页，如果是最后一个则退出" },
	{ on = "<C-z>", run = "suspend",            desc = "挂起进程" },

	# --- 光标移动 ---
	{ on = "k", run = "arrow prev", desc = "上移光标" },
	{ on = "j", run = "arrow next", desc = "下移光标" },

	{ on = "<Up>",   run = "arrow prev", desc = "上移光标" },
	{ on = "<Down>", run = "arrow next", desc = "下移光标" },

	{ on = "<C-u>", run = "arrow -50%",  desc = "向上滚动半页" },
	{ on = "<C-d>", run = "arrow 50%",   desc = "向下滚动半页" },
	{ on = "<C-b>", run = "arrow -100%", desc = "向上滚动一页" },
	{ on = "<C-f>", run = "arrow 100%",  desc = "向下滚动一页" },

	{ on = "<S-PageUp>",   run = "arrow -50%",  desc = "向上滚动半页" },
	{ on = "<S-PageDown>", run = "arrow 50%",   desc = "向下滚动半页" },
	{ on = "<PageUp>",     run = "arrow -100%", desc = "向上滚动一页" },
	{ on = "<PageDown>",   run = "arrow 100%",  desc = "向下滚动一页" },

	{ on = [ "g", "g" ], run = "arrow top", desc = "跳到顶部" },
	{ on = "G",          run = "arrow bot", desc = "跳到底部" },

	# --- 目录导航 ---
	{ on = "h", run = "leave", desc = "返回上级目录" },
	{ on = "l", run = "enter", desc = "进入子目录" },

	{ on = "<Left>",  run = "leave", desc = "返回上级目录" },
	{ on = "<Right>", run = "enter", desc = "进入子目录" },

	{ on = "H", run = "back",    desc = "回到上一个目录" },
	{ on = "L", run = "forward", desc = "前进到下一个目录" },

	# --- 选择文件 ---
	{ on = "<Space>", run = [ "toggle", "arrow 1" ], desc = "切换当前项的选中状态" },
	{ on = "<C-a>",   run = "toggle_all --state=on", desc = "全选" },
	{ on = "<C-r>",   run = "toggle_all",            desc = "反选" },

	# --- 可视模式 ---
	{ on = "v", run = "visual_mode",         desc = "进入可视模式 (选择模式)" },
	{ on = "V", run = "visual_mode --unset", desc = "进入可视模式 (取消选择模式)" },

	# --- 预览滚动 ---
	{ on = "K", run = "seek -5", desc = "预览向上滚动 5 行" },
	{ on = "J", run = "seek 5",  desc = "预览向下滚动 5 行" },

	# --- 文件信息 ---
	{ on = "<Tab>", run = "spot", desc = "显示当前文件信息" },

	# --- 文件操作 ---
	{ on = "o",         run = "open",                        desc = "打开选中的文件" },
	{ on = "O",         run = "open --interactive",          desc = "交互式选择打开方式" },
	{ on = "<Enter>",   run = "open",                        desc = "打开选中的文件" },
	{ on = "<S-Enter>", run = "open --interactive",          desc = "交互式选择打开方式" },
	{ on = "y",         run = "yank",                        desc = "复制选中的文件" },
	{ on = "x",         run = "yank --cut",                  desc = "剪切选中的文件" },
	{ on = "p",         run = "paste",                       desc = "粘贴文件" },
	{ on = "P",         run = "paste --force",               desc = "粘贴文件 (覆盖已存在的目标)" },
	{ on = "-",         run = "link",                        desc = "创建符号链接 (绝对路径)" },
	{ on = "_",         run = "link --relative",             desc = "创建符号链接 (相对路径)" },
	{ on = "<C-->",     run = "hardlink",                    desc = "创建硬链接" },
	{ on = "Y",         run = "unyank",                      desc = "取消复制/剪切状态" },
	{ on = "X",         run = "unyank",                      desc = "取消复制/剪切状态" },
	{ on = "d",         run = "remove",                      desc = "移到回收站" },
	{ on = "D",         run = "remove --permanently",        desc = "永久删除" },
	{ on = "a",         run = "create",                      desc = "创建文件 (以 / 结尾则创建目录)" },
	{ on = "r",         run = "rename --cursor=before_ext",  desc = "重命名" },
	{ on = ";",         run = "shell --interactive",         desc = "执行 Shell 命令" },
	{ on = ":",         run = "shell --block --interactive", desc = "执行 Shell 命令 (阻塞等待)" },
	{ on = ".",         run = "hidden toggle",               desc = "切换隐藏文件显示" },
	{ on = "s",         run = "search --via=fd",             desc = "通过 fd 按文件名搜索" },
	{ on = "S",         run = "search --via=rg",             desc = "通过 ripgrep 按内容搜索" },
	{ on = "<C-s>",     run = "escape --search",             desc = "取消正在进行的搜索" },
	{ on = "z",         run = "plugin fzf",                  desc = "通过 fzf 快速跳转" },
	{ on = "Z",         run = "plugin zoxide",               desc = "通过 zoxide 历史目录跳转" },

	# --- 行显示模式 ---
	{ on = [ "m", "s" ], run = "linemode size",        desc = "行模式: 文件大小" },
	{ on = [ "m", "p" ], run = "linemode permissions", desc = "行模式: 权限" },
	{ on = [ "m", "b" ], run = "linemode btime",       desc = "行模式: 创建时间" },
	{ on = [ "m", "m" ], run = "linemode mtime",       desc = "行模式: 修改时间" },
	{ on = [ "m", "o" ], run = "linemode owner",       desc = "行模式: 所有者" },
	{ on = [ "m", "n" ], run = "linemode none",        desc = "行模式: 无" },

	# --- 复制路径 ---
	{ on = [ "c", "c" ], run = "copy path",             desc = "复制文件路径" },
	{ on = [ "c", "d" ], run = "copy dirname",          desc = "复制目录路径" },
	{ on = [ "c", "f" ], run = "copy filename",         desc = "复制文件名" },
	{ on = [ "c", "n" ], run = "copy name_without_ext", desc = "复制文件名 (不含扩展名)" },

	# --- 过滤与查找 ---
	{ on = "f", run = "filter --smart", desc = "过滤当前目录文件" },
	{ on = "/", run = "find --smart",            desc = "向下查找" },
	{ on = "?", run = "find --previous --smart", desc = "向上查找" },
	{ on = "n", run = "find_arrow",              desc = "跳转到下一个匹配项" },
	{ on = "N", run = "find_arrow --previous",   desc = "跳转到上一个匹配项" },

	# --- 排序 ---
	{ on = [ ",", "m" ], run = [ "sort mtime --reverse=no", "linemode mtime" ],  desc = "按修改时间排序" },
	{ on = [ ",", "M" ], run = [ "sort mtime --reverse=yes", "linemode mtime" ], desc = "按修改时间排序 (反向)" },
	{ on = [ ",", "b" ], run = [ "sort btime --reverse=no", "linemode btime" ],  desc = "按创建时间排序" },
	{ on = [ ",", "B" ], run = [ "sort btime --reverse=yes", "linemode btime" ], desc = "按创建时间排序 (反向)" },
	{ on = [ ",", "e" ], run = "sort extension --reverse=no",                    desc = "按扩展名排序" },
	{ on = [ ",", "E" ], run = "sort extension --reverse=yes",                   desc = "按扩展名排序 (反向)" },
	{ on = [ ",", "a" ], run = "sort alphabetical --reverse=no",                 desc = "按字母顺序排序" },
	{ on = [ ",", "A" ], run = "sort alphabetical --reverse=yes",                desc = "按字母顺序排序 (反向)" },
	{ on = [ ",", "n" ], run = "sort natural --reverse=no",                      desc = "按自然顺序排序" },
	{ on = [ ",", "N" ], run = "sort natural --reverse=yes",                     desc = "按自然顺序排序 (反向)" },
	{ on = [ ",", "s" ], run = [ "sort size --reverse=no", "linemode size" ],    desc = "按大小排序" },
	{ on = [ ",", "S" ], run = [ "sort size --reverse=yes", "linemode size" ],   desc = "按大小排序 (反向)" },
	{ on = [ ",", "r" ], run = "sort random --reverse=no",                       desc = "随机排序" },

	# --- 快速跳转 ---
	{ on = [ "g", "h" ],       run = "cd ~",             desc = "跳转到主目录" },
	{ on = [ "g", "c" ],       run = "cd ~/.config",     desc = "跳转到 ~/.config" },
	{ on = [ "g", "d" ],       run = "cd ~/Downloads",   desc = "跳转到 ~/Downloads" },
	{ on = [ "g", "<Space>" ], run = "cd --interactive", desc = "交互式跳转" },
	{ on = [ "g", "f" ],       run = "follow",           desc = "跟随符号链接" },

	# --- 标签页 ---
	{ on = [ "t", "t" ], run = "tab_create --current",     desc = "在当前目录新建标签页" },
	{ on = [ "t", "r" ], run = "tab_rename --interactive", desc = "重命名当前标签页" },

	{ on = "1", run = "tab_switch 0", desc = "切换到第 1 个标签页" },
	{ on = "2", run = "tab_switch 1", desc = "切换到第 2 个标签页" },
	{ on = "3", run = "tab_switch 2", desc = "切换到第 3 个标签页" },
	{ on = "4", run = "tab_switch 3", desc = "切换到第 4 个标签页" },
	{ on = "5", run = "tab_switch 4", desc = "切换到第 5 个标签页" },
	{ on = "6", run = "tab_switch 5", desc = "切换到第 6 个标签页" },
	{ on = "7", run = "tab_switch 6", desc = "切换到第 7 个标签页" },
	{ on = "8", run = "tab_switch 7", desc = "切换到第 8 个标签页" },
	{ on = "9", run = "tab_switch 8", desc = "切换到第 9 个标签页" },

	{ on = "[", run = "tab_switch -1 --relative", desc = "切换到上一个标签页" },
	{ on = "]", run = "tab_switch 1 --relative",  desc = "切换到下一个标签页" },

	{ on = "{", run = "tab_swap -1", desc = "与上一个标签页交换位置" },
	{ on = "}", run = "tab_swap 1",  desc = "与下一个标签页交换位置" },

	# --- 任务管理 ---
	{ on = "w", run = "tasks:show", desc = "显示任务管理器" },

	# --- 帮助 ---
	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

# =========================================
# [tasks] — 任务管理器层
# =========================================
[tasks]

keymap = [
	{ on = "<Esc>", run = "close", desc = "关闭任务管理器" },
	{ on = "<C-[>", run = "close", desc = "关闭任务管理器" },
	{ on = "<C-c>", run = "close", desc = "关闭任务管理器" },
	{ on = "w",     run = "close", desc = "关闭任务管理器" },

	{ on = "k", run = "arrow prev", desc = "上一个任务" },
	{ on = "j", run = "arrow next", desc = "下一个任务" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一个任务" },
	{ on = "<Down>", run = "arrow next", desc = "下一个任务" },

	{ on = "<Enter>", run = "inspect", desc = "查看任务详情" },
	{ on = "x",       run = "cancel",  desc = "取消任务" },

	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

# =========================================
# [spot] — 文件信息查看器层
# =========================================
[spot]

keymap = [
	{ on = "<Esc>", run = "close", desc = "关闭信息面板" },
	{ on = "<C-[>", run = "close", desc = "关闭信息面板" },
	{ on = "<C-c>", run = "close", desc = "关闭信息面板" },
	{ on = "<Tab>", run = "close", desc = "关闭信息面板" },

	{ on = "k", run = "arrow prev", desc = "上一行" },
	{ on = "j", run = "arrow next", desc = "下一行" },
	{ on = "h", run = "swipe prev", desc = "切换到上一个文件" },
	{ on = "l", run = "swipe next", desc = "切换到下一个文件" },

	{ on = "<Up>",    run = "arrow prev", desc = "上一行" },
	{ on = "<Down>",  run = "arrow next", desc = "下一行" },
	{ on = "<Left>",  run = "swipe prev", desc = "切换到上一个文件" },
	{ on = "<Right>", run = "swipe next", desc = "切换到下一个文件" },

	{ on = [ "c", "c" ], run = "copy cell", desc = "复制选中的单元格" },

	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

# =========================================
# [pick] — 选择器层 (如「用...打开」)
# =========================================
[pick]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "取消选择" },
	{ on = "<C-[>",   run = "close",          desc = "取消选择" },
	{ on = "<C-c>",   run = "close",          desc = "取消选择" },
	{ on = "<Enter>", run = "close --submit", desc = "确认选择" },

	{ on = "k", run = "arrow prev", desc = "上一个选项" },
	{ on = "j", run = "arrow next", desc = "下一个选项" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一个选项" },
	{ on = "<Down>", run = "arrow next", desc = "下一个选项" },

	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

# =========================================
# [input] — 输入框层 (创建、重命名等)
#  支持 Vim 风格的编辑操作
# =========================================
[input]

keymap = [
	{ on = "<C-c>",   run = "close",          desc = "取消输入" },
	{ on = "<Enter>", run = "close --submit", desc = "提交输入" },
	{ on = "<Esc>",   run = "escape",         desc = "返回普通模式，或取消输入" },
	{ on = "<C-[>",   run = "escape",         desc = "返回普通模式，或取消输入" },

	# 模式切换
	{ on = "i", run = "insert",                          desc = "进入插入模式" },
	{ on = "I", run = [ "move first-char", "insert" ],   desc = "跳到行首并进入插入模式" },
	{ on = "a", run = "insert --append",                 desc = "进入追加模式" },
	{ on = "A", run = [ "move eol", "insert --append" ], desc = "跳到行尾并进入追加模式" },
	{ on = "v", run = "visual",                          desc = "进入可视模式" },
	{ on = "r", run = "replace",                         desc = "替换单个字符" },

	# 选中整行
	{ on = "V",     run = [ "move bol", "visual", "move eol" ], desc = "选中行首到行尾" },
	{ on = "<C-A>", run = [ "move eol", "visual", "move bol" ], desc = "选中行尾到行首" },
	{ on = "<C-E>", run = [ "move bol", "visual", "move eol" ], desc = "选中行首到行尾" },

	# 字符级移动
	{ on = "h",       run = "move -1", desc = "左移一个字符" },
	{ on = "l",       run = "move 1",  desc = "右移一个字符" },
	{ on = "<Left>",  run = "move -1", desc = "左移一个字符" },
	{ on = "<Right>", run = "move 1",  desc = "右移一个字符" },
	{ on = "<C-b>",   run = "move -1", desc = "左移一个字符" },
	{ on = "<C-f>",   run = "move 1",  desc = "右移一个字符" },

	# 单词级移动
	{ on = "b",         run = "backward",                    desc = "移到上一个单词开头" },
	{ on = "B",         run = "backward --far",              desc = "移到上一个 WORD 开头" },
	{ on = "w",         run = "forward",                     desc = "移到下一个单词开头" },
	{ on = "W",         run = "forward --far",               desc = "移到下一个 WORD 开头" },
	{ on = "e",         run = "forward --end-of-word",       desc = "移到单词结尾" },
	{ on = "E",         run = "forward --far --end-of-word", desc = "移到 WORD 结尾" },
	{ on = "<A-b>",     run = "backward",                    desc = "移到上一个单词开头" },
	{ on = "<A-f>",     run = "forward --end-of-word",       desc = "移到单词结尾" },
	{ on = "<C-Left>",  run = "backward",                    desc = "移到上一个单词开头" },
	{ on = "<C-Right>", run = "forward --end-of-word",       desc = "移到单词结尾" },

	# 行级移动
	{ on = "0",      run = "move bol",        desc = "移到行首" },
	{ on = "$",      run = "move eol",        desc = "移到行尾" },
	{ on = "_",      run = "move first-char", desc = "移到第一个非空白字符" },
	{ on = "^",      run = "move first-char", desc = "移到第一个非空白字符" },
	{ on = "<C-a>",  run = "move bol",        desc = "移到行首" },
	{ on = "<C-e>",  run = "move eol",        desc = "移到行尾" },
	{ on = "<Home>", run = "move bol",        desc = "移到行首" },
	{ on = "<End>",  run = "move eol",        desc = "移到行尾" },

	# 删除
	{ on = "<Backspace>", run = "backspace",         desc = "删除光标前的字符" },
	{ on = "<Delete>",    run = "backspace --under", desc = "删除光标处的字符" },
	{ on = "<C-h>",       run = "backspace",         desc = "删除光标前的字符" },
	{ on = "<C-d>",       run = "backspace --under", desc = "删除光标处的字符" },

	# 剪切到寄存器
	{ on = "<C-u>",         run = "kill bol",      desc = "剪切到行首" },
	{ on = "<C-k>",         run = "kill eol",      desc = "剪切到行尾" },
	{ on = "<C-w>",         run = "kill backward", desc = "剪切到当前单词开头" },
	{ on = "<A-d>",         run = "kill forward",  desc = "剪切到当前单词结尾" },
	{ on = "<C-Backspace>", run = "kill backward", desc = "剪切到当前单词开头" },
	{ on = "<C-Delete>",    run = "kill forward",  desc = "剪切到当前单词结尾" },

	# Vim 风格操作
	{ on = "d", run = "delete --cut",                                      desc = "剪切选中字符" },
	{ on = "D", run = [ "delete --cut", "move eol" ],                      desc = "剪切到行尾" },
	{ on = "c", run = "delete --cut --insert",                             desc = "剪切选中字符并进入插入模式" },
	{ on = "C", run = [ "delete --cut --insert", "move eol" ],             desc = "剪切到行尾并进入插入模式" },
	{ on = "s", run = [ "delete --cut --insert", "move 1" ],               desc = "剪切当前字符并进入插入模式" },
	{ on = "S", run = [ "move bol", "delete --cut --insert", "move eol" ], desc = "剪切整行并进入插入模式" },
	{ on = "x", run = [ "delete --cut", "move 1 --in-operating" ],         desc = "剪切当前字符" },
	{ on = "y", run = "yank",                                              desc = "复制选中字符" },
	{ on = "p", run = "paste",                                             desc = "粘贴到光标后" },
	{ on = "P", run = "paste --before",                                    desc = "粘贴到光标前" },

	# 撤销 / 重做 / 大小写
	{ on = "u",     run = [ "undo", "casefy lower" ], desc = "撤销，或可视模式下小写" },
	{ on = "U",     run = "casefy upper",             desc = "大写" },
	{ on = "<C-r>", run = "redo",                     desc = "重做" },

	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

# =========================================
# [confirm] — 确认对话框层
# =========================================
[confirm]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "取消" },
	{ on = "<C-[>",   run = "close",          desc = "取消" },
	{ on = "<C-c>",   run = "close",          desc = "取消" },
	{ on = "<Enter>", run = "close --submit", desc = "确认" },

	{ on = "n", run = "close",          desc = "否 (取消)" },
	{ on = "y", run = "close --submit", desc = "是 (确认)" },

	{ on = "k", run = "arrow prev", desc = "上一行" },
	{ on = "j", run = "arrow next", desc = "下一行" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一行" },
	{ on = "<Down>", run = "arrow next", desc = "下一行" },

	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

# =========================================
# [cmp] — 补全组件层
# =========================================
[cmp]

keymap = [
	{ on = "<C-c>",   run = "close",                                      desc = "取消补全" },
	{ on = "<Tab>",   run = "close --submit",                             desc = "提交补全" },
	{ on = "<Enter>", run = [ "close --submit", "input:close --submit" ], desc = "完成补全并提交输入" },

	{ on = "<A-k>", run = "arrow prev", desc = "上一个候选项" },
	{ on = "<A-j>", run = "arrow next", desc = "下一个候选项" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一个候选项" },
	{ on = "<Down>", run = "arrow next", desc = "下一个候选项" },

	{ on = "<C-p>", run = "arrow prev", desc = "上一个候选项" },
	{ on = "<C-n>", run = "arrow next", desc = "下一个候选项" },

	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

# =========================================
# [help] — 帮助菜单层
# =========================================
[help]

keymap = [
	{ on = "<Esc>", run = "escape", desc = "清除过滤器，或关闭帮助" },
	{ on = "<C-[>", run = "escape", desc = "清除过滤器，或关闭帮助" },
	{ on = "<C-c>", run = "close",  desc = "关闭帮助" },

	{ on = "k", run = "arrow prev", desc = "上一行" },
	{ on = "j", run = "arrow next", desc = "下一行" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一行" },
	{ on = "<Down>", run = "arrow next", desc = "下一行" },

	{ on = "f", run = "filter", desc = "过滤帮助条目" },
]
